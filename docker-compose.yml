# Default local stack = base + Traefik (dev).
# Prefer explicit scripts for clarity:
#   ./scripts/compose-dev.sh up -d --build
#   ./scripts/compose-prod.sh up -d --build
#
# Equivalent:
#   docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.dev.yaml up -d --build

include:
  - path: deploy/compose/compose.yaml
  - path: deploy/compose/compose.dev.yaml
