{{- if and .Values.backend.enabled (not .Values.backend.existingSecret) }}
{{- $name := include "pargar.appSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $jwt := "" }}
{{- $admin := "" }}
{{- $metrics := .Values.backend.secrets.metricsToken | default "" }}
{{- if and $existing $existing.data }}
  {{- /* Reuse existing secrets so upgrades do not invalidate sessions / bootstrap. */}}
  {{- if index $existing.data "jwt-secret" }}
    {{- $jwt = index $existing.data "jwt-secret" | b64dec }}
  {{- end }}
  {{- if index $existing.data "admin-password" }}
    {{- $admin = index $existing.data "admin-password" | b64dec }}
  {{- end }}
  {{- if and (not $metrics) (index $existing.data "metrics-token") }}
    {{- $metrics = index $existing.data "metrics-token" | b64dec }}
  {{- end }}
{{- end }}
{{- if not $jwt }}
  {{- if and .Values.backend.secrets.jwtSecret (not (hasPrefix "change-me" .Values.backend.secrets.jwtSecret)) (ne .Values.backend.secrets.jwtSecret "") }}
    {{- $jwt = .Values.backend.secrets.jwtSecret }}
  {{- else }}
    {{- $jwt = randAlphaNum 48 }}
  {{- end }}
{{- end }}
{{- if not $admin }}
  {{- if and .Values.backend.secrets.adminPassword (not (hasPrefix "change-me" .Values.backend.secrets.adminPassword)) (ne .Values.backend.secrets.adminPassword "") }}
    {{- $admin = .Values.backend.secrets.adminPassword }}
  {{- else }}
    {{- $admin = randAlphaNum 24 }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pargar.labels" . | nindent 4 }}
  annotations:
    pargar.io/secret-source: generated-or-values
type: Opaque
stringData:
  jwt-secret: {{ $jwt | quote }}
  admin-password: {{ $admin | quote }}
  metrics-token: {{ $metrics | quote }}
  {{- if not .Values.postgres.enabled }}
  database-url: {{ required "external.databaseUrl required when postgres.enabled=false and existingSecret is empty" .Values.external.databaseUrl | quote }}
  {{- end }}
  {{- if not .Values.redis.enabled }}
  redis-url: {{ required "external.redisUrl required when redis.enabled=false and existingSecret is empty" .Values.external.redisUrl | quote }}
  {{- end }}
  {{- if not .Values.rustfs.enabled }}
  storage-access-key: {{ required "external.storageAccessKey required when rustfs.enabled=false and existingSecret is empty" .Values.external.storageAccessKey | quote }}
  storage-secret-key: {{ required "external.storageSecretKey required when rustfs.enabled=false and existingSecret is empty" .Values.external.storageSecretKey | quote }}
  {{- end }}
{{- end }}
